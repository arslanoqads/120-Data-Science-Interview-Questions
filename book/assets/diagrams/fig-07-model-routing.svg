<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="180" viewBox="0 0 680 180" role="img" aria-label="Model routing cascade">
  <rect width="680" height="180" fill="#ffffff"/>
  <text x="16" y="26" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a2332">Figure  Cost/latency routing (Week 20)</text>
  <g font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
    <rect x="20" y="60" width="100" height="50" rx="4" fill="#1a2332"/>
    <text x="70" y="90" text-anchor="middle" fill="#ffffff" font-weight="700">Request</text>
    <rect x="150" y="60" width="120" height="50" rx="4" fill="#e8f1f5" stroke="#1a6b7a"/>
    <text x="210" y="82" text-anchor="middle" fill="#1a2332" font-weight="700">Semantic cache</text>
    <text x="210" y="98" text-anchor="middle" fill="#4a5568" font-size="9">hit · return</text>
    <rect x="300" y="40" width="110" height="40" rx="4" fill="#2d6a4f"/>
    <text x="355" y="64" text-anchor="middle" fill="#ffffff" font-weight="700">Small model</text>
    <rect x="300" y="100" width="110" height="40" rx="4" fill="#1a6b7a"/>
    <text x="355" y="124" text-anchor="middle" fill="#ffffff" font-weight="700">Strong model</text>
    <rect x="450" y="60" width="120" height="50" rx="4" fill="#e8f1f5" stroke="#1a6b7a"/>
    <text x="510" y="82" text-anchor="middle" fill="#1a2332" font-weight="700">Cascade / escalate</text>
    <text x="510" y="98" text-anchor="middle" fill="#4a5568" font-size="9">on low confidence</text>
    <rect x="590" y="60" width="70" height="50" rx="4" fill="#1a2332"/>
    <text x="625" y="90" text-anchor="middle" fill="#ffffff" font-weight="700">Reply</text>
    <path d="M120 85 L150 85" stroke="#4a5568" stroke-width="2"/>
    <path d="M270 75 L300 60" stroke="#4a5568" stroke-width="1.5"/>
    <path d="M270 95 L300 120" stroke="#4a5568" stroke-width="1.5"/>
    <path d="M410 60 L450 75" stroke="#4a5568" stroke-width="1.5"/>
    <path d="M410 120 L450 95" stroke="#4a5568" stroke-width="1.5"/>
    <path d="M570 85 L590 85" stroke="#4a5568" stroke-width="2"/>
  </g>
  <text x="16" y="160" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" fill="#4a5568">Route-once vs escalate: research target ~15% strong calls while holding quality near the frontier baseline.</text>
</svg>
