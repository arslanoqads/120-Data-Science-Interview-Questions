<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-label="Curriculum roadmap across seven phases">
  <rect width="720" height="280" fill="#ffffff"/>
  <text x="24" y="32" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1a2332">Curriculum roadmap  29 weeks</text>
  <text x="24" y="52" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#4a5568">One flagship system compounded weekly - Phases 06 core - Phase 7 electives</text>
  <!-- Phase boxes -->
  <g font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
    <rect x="20" y="80" width="88" height="72" rx="4" fill="#e8f1f5" stroke="#1a6b7a" stroke-width="1.5"/>
    <text x="64" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#1a2332">Phase 0</text>
    <text x="64" y="126" text-anchor="middle" font-size="10" fill="#4a5568">Foundations</text>
    <text x="64" y="142" text-anchor="middle" font-size="9" fill="#1a6b7a">W13</text>

    <rect x="118" y="80" width="88" height="72" rx="4" fill="#e8f1f5" stroke="#1a6b7a" stroke-width="1.5"/>
    <text x="162" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#1a2332">Phase 1</text>
    <text x="162" y="126" text-anchor="middle" font-size="10" fill="#4a5568">LLM core</text>
    <text x="162" y="142" text-anchor="middle" font-size="9" fill="#1a6b7a">W45</text>

    <rect x="216" y="80" width="88" height="72" rx="4" fill="#e8f1f5" stroke="#1a6b7a" stroke-width="1.5"/>
    <text x="260" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#1a2332">Phase 2</text>
    <text x="260" y="126" text-anchor="middle" font-size="10" fill="#4a5568">RAG</text>
    <text x="260" y="142" text-anchor="middle" font-size="9" fill="#1a6b7a">W610</text>

    <rect x="314" y="80" width="88" height="72" rx="4" fill="#e8f1f5" stroke="#1a6b7a" stroke-width="1.5"/>
    <text x="358" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#1a2332">Phase 3</text>
    <text x="358" y="126" text-anchor="middle" font-size="10" fill="#4a5568">Agents</text>
    <text x="358" y="142" text-anchor="middle" font-size="9" fill="#1a6b7a">W1115</text>

    <rect x="412" y="80" width="88" height="72" rx="4" fill="#e8f1f5" stroke="#1a6b7a" stroke-width="1.5"/>
    <text x="456" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#1a2332">Phase 4</text>
    <text x="456" y="126" text-anchor="middle" font-size="10" fill="#4a5568">Evals</text>
    <text x="456" y="142" text-anchor="middle" font-size="9" fill="#1a6b7a">W1617</text>

    <rect x="510" y="80" width="88" height="72" rx="4" fill="#e8f1f5" stroke="#1a6b7a" stroke-width="1.5"/>
    <text x="554" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#1a2332">Phase 5</text>
    <text x="554" y="126" text-anchor="middle" font-size="10" fill="#4a5568">Production</text>
    <text x="554" y="142" text-anchor="middle" font-size="9" fill="#1a6b7a">W1821</text>

    <rect x="608" y="80" width="88" height="72" rx="4" fill="#e8f1f5" stroke="#1a6b7a" stroke-width="1.5"/>
    <text x="652" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#1a2332">Phase 6</text>
    <text x="652" y="126" text-anchor="middle" font-size="10" fill="#4a5568">Capstone</text>
    <text x="652" y="142" text-anchor="middle" font-size="9" fill="#1a6b7a">W2224</text>
  </g>
  <!-- arrows -->
  <g stroke="#1a6b7a" stroke-width="1.5" fill="#1a6b7a">
    <path d="M108 116 L116 116" marker-end="url(#a)"/>
    <path d="M206 116 L214 116"/>
    <path d="M304 116 L312 116"/>
    <path d="M402 116 L410 116"/>
    <path d="M500 116 L508 116"/>
    <path d="M598 116 L606 116"/>
  </g>
  <!-- Phase 7 -->
  <rect x="20" y="180" width="676" height="64" rx="4" fill="#f7faf8" stroke="#2d6a4f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="36" y="208" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1a2332">Phase 7  Supplementary electives (Weeks 2529)</text>
  <text x="36" y="228" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#4a5568">Context engineering - Fine-tuning decisions - Self-hosted models - Multimodal - Safety / adversarial testing</text>
</svg>
