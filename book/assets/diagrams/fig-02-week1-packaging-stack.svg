<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="220" viewBox="0 0 680 220" role="img" aria-label="Production Python packaging stack">
  <rect width="680" height="220" fill="#ffffff"/>
  <text x="20" y="28" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a2332">Figure  Week 1 packaging stack</text>
  <g font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
    <rect x="20" y="50" width="120" height="48" rx="4" fill="#1a2332"/>
    <text x="80" y="78" text-anchor="middle" fill="#ffffff" font-weight="700">src/ package</text>
    <rect x="160" y="50" width="120" height="48" rx="4" fill="#1a6b7a"/>
    <text x="220" y="78" text-anchor="middle" fill="#ffffff" font-weight="700">Lockfile + venv</text>
    <rect x="300" y="50" width="120" height="48" rx="4" fill="#1a6b7a"/>
    <text x="360" y="78" text-anchor="middle" fill="#ffffff" font-weight="700">Types (mypy)</text>
    <rect x="440" y="50" width="120" height="48" rx="4" fill="#1a6b7a"/>
    <text x="500" y="78" text-anchor="middle" fill="#ffffff" font-weight="700">pytest skeleton</text>
    <rect x="540" y="120" width="120" height="48" rx="4" fill="#2d6a4f"/>
    <text x="600" y="148" text-anchor="middle" fill="#ffffff" font-weight="700">CI lint + types</text>
    <rect x="20" y="120" width="200" height="48" rx="4" fill="#e8f1f5" stroke="#1a6b7a"/>
    <text x="120" y="148" text-anchor="middle" fill="#1a2332" font-weight="600">Structured logging</text>
    <path d="M80 98 L80 120" stroke="#4a5568" stroke-width="1.5"/>
    <path d="M220 98 L220 110 L600 110 L600 120" stroke="#4a5568" stroke-width="1.5" fill="none"/>
    <text x="20" y="200" font-size="10" fill="#4a5568">Each layer depends on the one below it: CI is meaningless without an installable, typed package.</text>
  </g>
</svg>
